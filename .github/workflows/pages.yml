# Rebuilds the fixture snapshot from ESPN and republishes to GitHub Pages.
# Runs hourly, on every push, and on demand (Actions > Deploy calendar > Run workflow).
name: Deploy calendar
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly; off the top of the hour, when GitHub queues are busiest
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # keepalive below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q certifi
      # start from what's live now (not the committed snapshot, which only changes on manual pushes),
      # so a failed or partial fetch keeps the latest good data instead of rolling back weeks
      - run: curl -fsS "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/fixtures.js" -o fixtures.js || echo "::warning::Couldn't download the live snapshot; using the committed one"
      - run: python3 fetch_fixtures.py || echo "::warning::Fetch failed; republishing the current snapshot unchanged"
      - run: mkdir -p public && cp index.html fixtures.js public/ && touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      # GitHub disables scheduled workflows after 60 days without repo activity; re-enabling keeps the hourly refresh alive
      - if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/enable" || echo "::warning::keepalive failed"
        env:
          GH_TOKEN: ${{ github.token }}
