# Rebuilds the fixture snapshot from ESPN and republishes to GitHub Pages.
# Runs hourly, on every push, and on demand (Actions > Deploy calendar > Run workflow).
name: Deploy calendar
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly; off the top of the hour, when GitHub queues are busiest
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q certifi
      # if ESPN is unreachable, the committed snapshot is published instead
      - run: python3 fetch_fixtures.py || echo "Fetch failed, publishing committed snapshot"
      - run: mkdir -p public && cp index.html fixtures.js public/ && touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
